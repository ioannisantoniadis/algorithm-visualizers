[project]
name = "algorithm-visualizers"
version = "0.1.0"
description = "From-scratch NumPy implementations of 21 classic ML/algorithms, each with an interactive Streamlit + Plotly step-by-step visualiser."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "plotly>=5.22",
    "streamlit>=1.50",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "networkx>=3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
