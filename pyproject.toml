[project]
name = "algorithm-visualizers"
version = "0.1.0"
description = "From-scratch NumPy implementations of 20 classic ML/algorithms, each with an interactive Streamlit + Plotly step-by-step visualiser."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "plotly>=5.22",
    "streamlit>=1.50",
]
