name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies (including the dev group with the reference libraries)
        run: uv sync

      - name: Reference checks and page smoke tests
        env:
          PYTHONUNBUFFERED: "1"
        run: uv run pytest -v --durations=15 --timeout=240
